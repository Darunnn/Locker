; ============================================================
;  locker_config.ini
;  วางไว้ที่ folder เดียวกับ .exe
;  เปลี่ยนแค่ Mode= ตามเครื่องที่ติดตั้ง
; ============================================================

[App]
Mode = pharmacy         ; pharmacy = ห้องยา | delivery = จุดรับยา

[Pharmacy] ;[Delivery]
Port        = COM3
BaudRate    = 9600
TimeoutMs   = 600
BoardAddr   = 1
; รูปแบบ Channels ที่ใช้ได้:
;   เรียงต่อกัน  Channels = 1-25
;   เดี่ยวๆ      Channels = 1,3,5,7
;   ผสม          Channels = 1-10,12,15,20-25
Channels    = 1-25


[Locker]
PreventBothSidesOpen = true
AutoRelockDelayMs    = 0