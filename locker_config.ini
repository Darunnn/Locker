; ============================================================
;  locker_config.ini — DMS Hospital Drug Locker
;  วางไฟล์นี้ข้างๆ .exe ทั้ง 2 เครื่อง
;
;  เครื่องห้องยา  → Mode=pharmacy
;  เครื่องคนรับยา → Mode=delivery
; ============================================================

[App]
; บอกว่าเครื่องนี้เป็นฝั่งไหน: pharmacy | delivery
Mode=pharmacy

; ชื่อแสดงบนหน้าจอ (optional)
AppTitle=ระบบจ่ายยา IPD — ห้องยา

; ============================================================
;  ฝั่งห้องยา (Pharmacy side)
;  — เจ้าหน้าที่ห้องยา scan QR, assign locker, วางยา
; ============================================================
[Pharmacy]
Port=COM3
BaudRate=9600
TimeoutMs=600
BoardAddr=1
MaxChannels=24

; ============================================================
;  ฝั่งคนมารับยา (Delivery/Patient side)
;  — เจ้าหน้าที่ ward / ผู้ป่วย scan รับยา
; ============================================================
[Delivery]
Port=COM4
BaudRate=9600
TimeoutMs=600
BoardAddr=1
MaxChannels=24

; ============================================================
;  ค่า shared ใช้ร่วมกันทั้ง 2 ฝั่ง
; ============================================================
[Locker]
; ห้ามเปิด 2 ด้านพร้อมกัน (ต้องมีระบบ lock ที่ API layer)
PreventBothSidesOpen=true

; หน่วงเวลาหลัง unlock ก่อน re-lock (ms, 0 = ไม่ auto)
AutoRelockDelayMs=0
